name: Deploy to AWS

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM build
        working-directory: aws
        run: sam build

      - name: SAM deploy
        working-directory: aws
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Upload site to CloudFront bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name clouddropdesigns --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          aws s3 sync dist "s3://$BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          DOMAIN=$(aws cloudformation describe-stacks --stack-name clouddropdesigns --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" --output text)
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='$DOMAIN'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
