name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: clouddropdesigns
  NODE_VERSION: '22'

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API function dependencies
        run: npm ci --prefix functions-api

      - name: Build site
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUDDROPDESIGNS }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Deploy Hosting and content API
        run: >
          firebase deploy
          --only "hosting,functions:api"
          --project ${{ env.FIREBASE_PROJECT }}
          --non-interactive
