<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | CloudDropDesigns</title>
    <meta
      name="description"
      content="The page you requested could not be found on CloudDropDesigns."
    />
    <link rel="canonical" href="https://clouddropdesigns.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #141414;
        color: #f4f2ee;
        font-family: Montserrat, system-ui, sans-serif;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: 'Bodoni Moda', Georgia, serif;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 600;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: rgba(244, 242, 238, 0.72);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      a {
        display: inline-flex;
        align-items: center;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(126, 184, 212, 0.45);
        border-radius: 999px;
        color: #f4f2ee;
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(126, 184, 212, 0.18);
      }

      a.secondary {
        background: transparent;
        border-color: rgba(126, 184, 212, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>That URL does not match a page on CloudDropDesigns. Try the studio portal, portfolio, or site map.</p>
      <div class="actions">
        <a href="/">Back to home</a>
        <a class="secondary" href="/sitemap">View site map</a>
      </div>
    </main>
  </body>
</html>
